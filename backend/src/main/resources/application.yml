server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force-request: true

spring:
  application:
    name: jrfotografia-api
  # Sem perfil informado (Run no NetBeans ou terminal), usa o modo "local": MySQL do seu computador,
  # usuário root sem senha, como no MySQL Workbench. Para não usar MySQL, rode com o perfil "dev" (banco H2).
  # Em produção, o docker-compose define SPRING_PROFILES_ACTIVE=prod e valem as variáveis DB_*.
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jrfotografia?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=America/Fortaleza}
    username: ${DB_USUARIO:jrfotografia}
    password: ${DB_SENHA:jrfotografia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: America/Fortaleza
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 400MB
  jackson:
    time-zone: America/Fortaleza

app:
  estudio-padrao: jrfotografia
  jwt:
    segredo: ${JWT_SEGREDO:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
    horas-painel: 12
    horas-galeria: 6
  admin:
    nome: ${ADMIN_NOME:Joel Júnior}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
  arquivos:
    pasta: ${ARQUIVOS_PASTA:./dados/arquivos}
  galeria:
    validade-dias: 90
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}

---
# MySQL do computador de desenvolvimento (root sem senha). O banco jrfotografia é criado sozinho.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jrfotografia?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=America/Fortaleza&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USUARIO:root}
    # Senha do MySQL desta máquina. Em outro computador, troque aqui ou defina DB_SENHA.
    password: ${DB_SENHA:araca123}
app:
  admin:
    email: ${ADMIN_EMAIL:admin@jrfotografia.local}
    senha: ${ADMIN_SENHA:trocar123}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./dados/banco-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password:
app:
  admin:
    email: ${ADMIN_EMAIL:admin@jrfotografia.local}
    senha: ${ADMIN_SENHA:trocar123}
